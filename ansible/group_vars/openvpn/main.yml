---

# Network config
openvpn_server_hostname: 74.101.208.68
openvpn_server_network: 192.168.70.0
openvpn_dns_servers:
 - 192.168.69.254

# LDAP
openvpn_use_ldap: true
openvpn_ldap_url: ldaps://ldap-01.dev.qimata:636
openvpn_ldap_bind_dn: "cn=admin,dc=qimata,dc=com"
openvpn_ldap_bind_password: ld@p123!
openvpn_ldap_base_dn: "ou=users,dc=qimata,dc=com"
openvpn_ldap_search_filter: "(uid=%u)"

# openvpn_ldap_tls_enable: true

openvpn_clients: 
  client1:
    config:
      - ifconfig-push 10.0.0.2 255.255.255.0
      - push "route 192.168.1.0 255.255.255.0"
      - push "dhcp-option DOMAIN example.com"
      - iroute 192.168.4.0 255.255.255.0
    key: "{{ client_1_key }}"
    crt: "{{ client_1_crt }}"
