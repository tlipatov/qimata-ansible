---

## Create entries

- name: "Entry: create entry on {{item.org}}.{{item.tld}}"
  community.general.ldap_entry:
    bind_dn: "cn={{item.bind_user}},dc={{item.org}},dc={{item.tld}}"
    bind_pw: "{{item.bind_password}}"
    dn: "{{this_item.dn}}"
    objectClass: "{{this_item.objectClass | default([]) }}"
    attributes: "{{this_item.attributes | default([]) }}"
  loop: "{{ item.entries | default([]) }}"
  loop_control:
    loop_var: this_item
  tags: openldap, entries
