---

# Networking
openvpn_port: 1194
openvpn_proto: udp
openvpn_server_ipv6_network: false
openvpn_server_hostname: "{{ inventory_hostname }}"
openvpn_server_netmask: 255.255.255.0
openvpn_server_network: 10.9.0.0
openvpn_client_to_client: false
openvpn_dns_servers:
  - 1.0.0.1
  - 1.1.1.1
  - 8.8.8.8
  - 8.8.4.4
openvpn_dualstack: true
openvpn_keepalive_ping: 5
openvpn_keepalive_timeout: 30
openvpn_redirect_gateway: true
openvpn_resolv_retry: 5
openvpn_set_dns: true
openvpn_tun_mtu: false

# Operations
openvpn_add_server_options: []
openvpn_compression: lzo
openvpn_enable_management: false
openvpn_ifconfig_pool_persist_file: ipp.txt
openvpn_management_bind: /var/run/openvpn/management unix
openvpn_management_client_user: root
openvpn_push: []
openvpn_user: nobody
openvpn_group: nogroup
openvpn_service_name: openvpn-server@openvpn
openvpn_status_version: 1

# Firewall
openvpn_masquerade_not_snat: false
openvpn_ufw_allow_interfaces:
  - tun0

# clients
openvpn_client_config: false
openvpn_clients: {}

# Example:
# openvpn_clients: 
#   client1:
#     client_options: []
#     config:
#       - ifconfig-push 10.0.0.2 255.255.255.0
#       - push "route 192.168.1.0 255.255.255.0"
#       - push "dhcp-option DOMAIN example.com"
#       - iroute 192.168.4.0 255.255.255.0
#     key: |
#       base64 encoded key contnet..
#     crt: |
#       base64 encoded crt content...

openvpn_client_absent: []
# Example:
# openvpn_client_absent:
#   - client2
#   - client3

# Directories
openvpn_base_dir: /etc/openvpn
openvpn_key_dir: /etc/openvpn/keys
openvpn_ovpn_dir: "{{ openvpn_base_dir }}/client_ovpn"
openvpn_server_dir: "{{ openvpn_base_dir }}/server"
openvpn_client_dir: "{{ openvpn_base_dir }}/ccd"

# Package
openvpn_packages:
  - openvpn
  - openvpn-systemd-resolved

openvpn_packages_plugin_ldap:
  - openvpn-auth-ldap

# Security
# Generate TLS server and client keys
# Otherwise provide the ca, cert and key
openvpn_generate_ca: false
openvpn_generate_server_keys: false

# CA cert base64 encoded:
openvpn_ca_crt: ""

# CA key base64 encoded. Key only needed if signing server/client keys
openvpn_ca_key: ""

# dh.pem params file, will be generated if false
openvpn_dh_params: ""

# Server cert and key base64 encoded
openvpn_server_crt: ""
openvpn_server_key: ""

openvpn_auth_alg: SHA256
openvpn_cipher: AES-256-CBC
openvpn_duplicate_cn: false
openvpn_rsa_bits: 2048
openvpn_use_crl: false
openvpn_use_hardened_tls: true
openvpn_use_modern_tls: true
openvpn_verify_cn: false

openvpn_tls_auth_required: true
# openvpn TLS auth key base64 encoded
openvpn_tls_auth_key: ""

openvpn_script_security: 1

# LADAP
openvpn_use_ldap: false
openvpn_ldap_url: ldap://host.example.com
openvpn_ldap_anonymous_bind: false
openvpn_ldap_bind_dn: uid=Manager,ou=People,dc=example,dc=com
openvpn_ldap_bind_password: mysecretpassword

# LDAP TLS CA
openvpn_ldap_tls_enable: false
openvpn_ldap_tls_ca_cert_var: false
openvpn_ldap_tls_ca_cert_file: false

# LDAP TLS Cert
openvpn_ldap_tls_cert_var: false
openvpn_ldap_tls_cert_file: false

# LDAP TLS Key
openvpn_ldap_tls_key_var: false
openvpn_ldap_tls_key_file: false

openvpn_ldap_base_dn: ou=People,dc=example,dc=com
openvpn_ldap_search_filter: (&(uid=%u)(accountStatus=active))
openvpn_ldap_require_group: false
openvpn_ldap_group_base_dn: ou=Groups,dc=example,dc=com
openvpn_ldap_group_search_filter: (|(cn=developers)(cn=artists))

# Logrotate configuration
openvpn_log_dir: /var/log/openvpn
openvpn_log_file: "{{ openvpn_config_file }}.log"
openvpn_log_status_file: "status-{{ openvpn_config_file }}.log"
openvpn_logrotate_config: |
  rotate 4
  weekly
  missingok
  notifempty
  sharedscripts
  copytruncate
  delaycompress
