---

- name: "Package: install repmgr packages"
  apt:
    name: "{{ postgresql_repmgr_packages }}"
    state: present
  become: true
  register: result
  until: result is successful
  tags: package

- name: "Add replication user"
  become: true
  become_user: "{{ postgresql_user }}"
  community.postgresql.postgresql_user:
    name: "{{ postgresql_replication_user_name }}"
    password: "{{ postgresql_replication_user_password }}"
    comment: "Replication user"
    login_unix_socket: "{{ postgresql_unix_socket_directory }}"
    port: "{{postgresql_port}}"
    role_attr_flags: "{{ postgresql_replication_user_attr_flags }}"
    state: "present"
  tags: replication
  when: postgresql_replication_role == "primary"

- name: "Add replication database"
  become: true
  become_user: "{{ postgresql_user }}"
  community.postgresql.postgresql_db:
    name: "{{ postgresql_replication_db_name  }}"
    owner: "{{ postgresql_replication_user_name }}"
    login_unix_socket: "{{ postgresql_unix_socket_directory }}"
    port: "{{ postgresql_port }}"
    state: "present"
  tags: replication
  when: postgresql_replication_role == "primary"
