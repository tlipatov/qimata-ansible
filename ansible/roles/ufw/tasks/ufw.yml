---

- name: "UFW: Set logging"
  community.general.ufw:
    logging: 'on'

# We explicit manage SSH rule
- name: "UFW: Allow SSH"
  community.general.ufw:
    rule: allow
    name: OpenSSH
  when: ufw_allow_ssh | bool

- name: "UFW: Manage rules"
  community.general.ufw:
    rule: allow
    port: "{{item}}"
  loop: "{{ufw_allow_portss}}"

- name: "UFW: Enable"
  community.general.ufw:
    state: enabled
    policy: deny
