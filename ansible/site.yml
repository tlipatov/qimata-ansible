- hosts: all
  become: yes
  gather_facts: yes
  gather_timeout: 120

  roles:
  # Setup what we need to run ansible on host
  - role: ansible
    tags:
      ansible
  # All hosts get the UFW role
  - role: ufw
    tags:
    - ufw

# Setting global variables for the gluster roles to use


- name: Set gluster_cluster variables
  hosts: gluster_cluster
  tasks:
  - set_fact:
      gluster_ips: []
  - set_fact:
      gluster_ips: "{{ gluster_ips + [ hostvars[item]['ansible_env'].SSH_CONNECTION.split(' ')[2] ] }}"
    with_items: "{{ groups['gluster_cluster'] }}"
  - set_fact:
      gluster_nodes: "{{ groups['gluster_cluster'] }}"

# Variables for gluster_cluster set in the above three plays

- hosts: gluster_cluster
  become: yes
  gather_facts: yes
  gather_timeout: 120

  roles:
  - role: gluster

